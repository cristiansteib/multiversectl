name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS is a release target, so it is built and tested, not only cross-compiled.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Branch protection requires a check named exactly "test", so the Linux job
    # keeps that name; macOS reports beside it as "test-macos".
    name: ${{ matrix.os == 'ubuntu-latest' && 'test' || 'test-macos' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      # The web view is one embedded script; if it does not parse the page stays
      # blank on "connecting…" and no Go test notices.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: web view scripts parse
        run: |
          for f in internal/adapters/server/ui/*.js; do
            node --check "$f"
          done
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Known vulnerabilities in what this depends on, and in the Go toolchain
  # itself. govulncheck reports only the ones whose affected code is actually
  # reachable from here, so a finding is something to act on rather than a
  # line in a dependency list to argue about.
  vulns:
    name: vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
