# Two ways in:
#   * a push to main — semantic-release reads the commits, decides the version,
#     creates the tag and the release, then GoReleaser attaches the artifacts;
#   * a tag pushed by hand — GoReleaser alone, for when the version is a
#     deliberate choice rather than a consequence of the commits.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  from-commits:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The tag was just created by the step above.
      - if: steps.semantic.outputs.new_release_published == 'true'
        run: git fetch --tags --force

      - if: steps.semantic.outputs.new_release_published == 'true'
        name: Deploy key for the Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_DEPLOY_KEY" || { echo "::error::the HOMEBREW_TAP_DEPLOY_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          echo "HOMEBREW_TAP_KEY_FILE=$RUNNER_TEMP/tap_key" >> "$GITHUB_ENV"

      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.semantic.outputs.new_release_version }}

  from-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Deploy key for the Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_DEPLOY_KEY" || { echo "::error::the HOMEBREW_TAP_DEPLOY_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          echo "HOMEBREW_TAP_KEY_FILE=$RUNNER_TEMP/tap_key" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
