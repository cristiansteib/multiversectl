# Two ways in:
#   * a push to main — semantic-release reads the commits, decides the version,
#     creates the tag and the release, then GoReleaser attaches the artifacts;
#   * a tag pushed by hand — GoReleaser alone, for when the version is a
#     deliberate choice rather than a consequence of the commits.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Keyless signing: cosign exchanges this job's OIDC token for a short-lived
  # certificate, so nothing long-lived has to be kept anywhere.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Angular app is built once, here, and handed to the jobs that build the
  # binaries: it is embedded into them and never committed.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx ng build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: web/dist/web/browser
          if-no-files-found: error

  from-commits:
    needs: ui
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: internal/adapters/server/webapp
      # A binary without the build serves a placeholder page: stop here instead.
      - run: test -f internal/adapters/server/webapp/index.html

      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The tag was just created by the step above.
      - if: steps.semantic.outputs.new_release_published == 'true'
        run: git fetch --tags --force

      - if: steps.semantic.outputs.new_release_published == 'true'
        name: Deploy key for the Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_DEPLOY_KEY" || { echo "::error::the HOMEBREW_TAP_DEPLOY_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          echo "HOMEBREW_TAP_KEY_FILE=$RUNNER_TEMP/tap_key" >> "$GITHUB_ENV"

      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: sigstore/cosign-installer@v3

      - if: steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.semantic.outputs.new_release_version }}

  from-tag:
    needs: ui
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: internal/adapters/server/webapp
      # A binary without the build serves a placeholder page: stop here instead.
      - run: test -f internal/adapters/server/webapp/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Deploy key for the Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_DEPLOY_KEY" || { echo "::error::the HOMEBREW_TAP_DEPLOY_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          echo "HOMEBREW_TAP_KEY_FILE=$RUNNER_TEMP/tap_key" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The documentation site, built after the release so it can say which one it
  # is of: `git describe` is the tag just made, or, when this push released
  # nothing, the last one and how many commits are on top of it. It runs on a
  # push to main and on a tag, whichever of the two jobs above ran.
  pages:
    needs: [from-commits, from-tag]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tag the release job made a moment ago is not in the checkout yet.
      - run: git fetch --tags --force
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: echo "SITE_VERSION=$(git describe --tags --match 'v*')" >> "$GITHUB_ENV"
      - run: make docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
