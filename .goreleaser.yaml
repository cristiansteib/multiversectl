version: 2

project_name: multiversectl

builds:
  - id: multiversectl
    main: ./cmd/multiversectl
    binary: multiversectl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

  # Raw binary release assets named multiversectl_<os>_<arch> (no version).
  # The tool's own `update` command downloads exactly this name; do not change it.
  - id: raw
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

nfpms:
  - id: deb
    package_name: multiversectl
    formats: [deb]
    maintainer: "Cristian Steib <cristiansteib@gmail.com>"
    description: Manage numbered local development environments side by side.
    homepage: https://github.com/cristiansteib/multiversectl
    license: Apache-2.0
    section: utils
    bindir: /usr/bin
    contents:
      - src: /usr/bin/multiversectl
        dst: /usr/bin/mvctl
        type: symlink

brews:
  - name: multiversectl
    # The tap is a separate repository, so the workflow's own token cannot
    # write to it: HOMEBREW_TAP_TOKEN is a fine-grained token with contents
    # write on cristiansteib/homebrew-tap and nothing else.
    repository:
      owner: cristiansteib
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://cristiansteib.github.io/multiversectl/
    description: Run several complete copies of a multi-repository project side by side on one machine.
    license: Apache-2.0
    commit_author:
      name: Cristian Steib
      email: cristiansteib@gmail.com
    install: |
      bin.install "multiversectl"
      bin.install_symlink bin/"multiversectl" => "mvctl"
    test: |
      assert_match "multiversectl", shell_output("#{bin}/multiversectl version")

release:
  mode: append
  # A tag can be pushed again at the same version — after a history rewrite,
  # or when a release is re-run. Replacing the artifacts makes that idempotent
  # instead of failing on "asset already exists".
  replace_existing_artifacts: true

# semantic-release writes the release notes from the commits, so GoReleaser
# only attaches artifacts to the release it already created.
changelog:
  disable: true
