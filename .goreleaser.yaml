version: 2

project_name: multiversectl

builds:
  - id: multiversectl
    main: ./cmd/multiversectl
    binary: multiversectl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  # The web view is its own binary: the command line carries no HTTP server.
  - id: multiversectl-server
    main: ./cmd/multiversectl-server
    binary: multiversectl-server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

  # Raw binary release assets named multiversectl_<os>_<arch> (no version).
  # The tool's own `update` command downloads exactly this name; do not change it.
  - id: raw
    ids: [multiversectl]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

  - id: raw-server
    ids: [multiversectl-server]
    formats: [binary]
    name_template: "multiversectl-server_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# The checksum file is what `self-update` verifies every download against, and
# signing it is what makes it more than a convenience: with the signature,
# somebody who swapped an asset would have to swap the list with it and then
# produce a signature for the new list, which keyless signing ties to this
# repository's workflow rather than to a key anyone could steal.
#
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp '^https://github.com/cristiansteib/multiversectl/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"

nfpms:
  - id: deb
    package_name: multiversectl
    formats: [deb]
    maintainer: "Cristian Steib <cristiansteib@gmail.com>"
    description: Manage numbered local development environments side by side.
    homepage: https://github.com/cristiansteib/multiversectl
    license: Apache-2.0
    section: utils
    bindir: /usr/bin
    contents:
      - src: /usr/bin/multiversectl
        dst: /usr/bin/mvctl
        type: symlink

brews:
  - name: multiversectl
    # The tarball holds both programs; the raw per-platform binaries are for
    # self-update and the install script, and a formula cannot pick between them.
    ids: [tarball]
    # The tap is a separate repository, so the workflow's own token cannot
    # write to it. A deploy key can: it is added to cristiansteib/homebrew-tap
    # with write access, is good for that repository and nothing else, and its
    # private half is the HOMEBREW_TAP_DEPLOY_KEY secret, which the workflow
    # writes to the file named by HOMEBREW_TAP_KEY_FILE.
    repository:
      owner: cristiansteib
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:cristiansteib/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY_FILE }}"
    directory: Formula
    homepage: https://multiversectl.dev/
    description: Run several complete copies of a multi-repository project side by side on one machine.
    license: Apache-2.0
    commit_author:
      name: Cristian Steib
      email: cristiansteib@gmail.com
    install: |
      bin.install "multiversectl"
      bin.install "multiversectl-server"
      bin.install_symlink bin/"multiversectl" => "mvctl"
    test: |
      assert_match "multiversectl", shell_output("#{bin}/multiversectl version")

# The release is created by semantic-release as a draft, which nobody can see or download
# from, and GoReleaser fills that very draft and publishes it as its last step. The release
# is therefore "latest" only once every binary is attached; before this it was visible, and
# empty, for the minutes the build took. A tag pushed by hand has no draft to find, and
# GoReleaser makes the release itself.
release:
  use_existing_draft: true
  # Keep the notes semantic-release wrote on the draft.
  mode: keep-existing
  # A tag can be pushed again at the same version — after a history rewrite,
  # or when a release is re-run. Replacing the artifacts makes that idempotent
  # instead of failing on "asset already exists". With use_existing_draft the
  # release it fills is found among the drafts, so a re-run of one that was
  # already published needs it made a draft again first
  # (gh release edit vX.Y.Z --draft).
  replace_existing_artifacts: true

# semantic-release writes the release notes from the commits, so GoReleaser
# only attaches artifacts to the release it already created.
changelog:
  disable: true
