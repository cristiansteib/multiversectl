# The site's menu and its page order, read by internal/tools/docgen.
# A page here needs a fragment of the same path; a fragment with no page here
# is an error, because nothing would link to it.
#
# Two tiers, on purpose. "Start here" is the short visual answer to what this
# is and how it hangs together: a figure a reader can take in at a glance, and
# as little prose as the figure needs. Everything exhaustive — every field,
# every flag, every edge — lives under the groups below it, and the simple
# pages link down into them rather than repeating them.
groups:
  - title: Start here
    pages:
      - path: index
        title: multiversectl
        nav: Home
        hero: true
        summary: >-
          Run your whole multi-repository stack as many times as you need,
          side by side, on one machine. Every copy gets its own branch, its
          own containers and its own hostnames — so reviews, agents and
          benchmarks run in parallel instead of taking turns.
      - path: docs
        title: Documentation
        nav: Documentation
        summary: >-
          How a universe is put together, and where everything else is: the
          visual pages first, then the reference.
      - path: start/machine
        title: What's on your machine
        nav: On your machine
        summary: >-
          One picture of it all: what the machine keeps and every universe
          shares, what one universe owns, and what is rewritten on every
          start — with networking, data and what is actually running.
      - path: start/lifecycle
        title: Life of a universe
        notoc: true
        summary: >-
          What exists after new, up, down and rm, what each of them keeps,
          and the order up does its work in.
      - path: start/install
        title: Install
        summary: One binary for Linux and macOS, from a script, mise, a .deb or source.
      - path: start/quickstart
        title: Quick start
        summary: >-
          Describe a multiverse, create a universe and open it — from nothing to
          two running copies of a multiverse.
  - title: In depth
    pages:
      - path: start/concepts
        title: Concepts at a glance
        nav: Concepts at a glance
        summary: >-
          The five words this documentation uses — multiverse, universe, app,
          host and entrypoint — and how they fit together.
      - path: start/scope
        title: What it does, and what it is not
        nav: What it does
        summary: >-
          Everything it gives you, feature by feature, and the jobs it is the
          wrong tool for, with what to use instead.
      - path: concepts/universes
        title: Universes
        summary: >-
          What a universe is made of, how it is named, and what it does and
          does not share with the others.
      - path: concepts/networking
        title: Networking
        summary: >-
          One shared proxy, one hostname per address per universe, and why no
          universe publishes a port of its own.
      - path: concepts/storage
        title: Storage and data
        summary: >-
          Where a universe's code, images, volumes and secrets live, which of
          them are shared, and what removing one destroys.
      - path: concepts/overlays
        title: Overlays and merge order
        summary: >-
          The files that make up an app, the order they are merged in, and
          where to put a value that only this environment knows.
      - path: concepts/labels
        title: Labels
        summary: >-
          How a compose file describes itself: the addresses it answers on, the
          ports it must keep, and the values it needs from its universe.
      - path: concepts/catalogs
        title: Catalogs
        summary: >-
          An index of multiverses and of other indexes, kept in git, that says
          what exists and leaves what is installed to each machine.
      - path: start/compare
        title: Compared with other tools
        nav: Compared with others
        summary: >-
          A feature table of multiversectl next to Docktree, container-use,
          Tilt, Skaffold, Garden and Preevy, and when to pick another.
  - title: Tasks
    pages:
      - path: tasks/branches
        title: Work across branches
        summary: >-
          Put a feature in its own universe, override one repository's branch,
          add a repository, and remove a universe when you are done.
      - path: tasks/reach
        title: Reach a universe
        summary: >-
          From another device, from a domain you own, from a shell, and from a
          database client.
      - path: tasks/services
        title: Control which services run
        summary: >-
          Start optional services on demand, keep a published port, and give a
          service its own hostname.
      - path: tasks/catalog
        title: Manage many multiverses from one index
        summary: >-
          Set up a root catalog, nest another one under it, list multiverses in
          it, and install only the ones this machine needs.
      - path: tasks/server
        title: Explore and run it in a browser
        summary: >-
          A live web view of the catalog, the multiverses and the fleet of
          universes, with versions and buttons to start, stop, create and
          remove universes, behind a token.
  - title: Reference
    pages:
      - path: reference/cli
        title: Commands
        summary: Every command, what it does and the arguments it takes.
      - path: reference/manifest
        title: Manifest
        summary: Every field of a multiverse manifest, with its default.
      - path: reference/variables
        title: Variables and labels
        summary: >-
          What a universe passes to the runtime, and the labels a compose file
          can use to ask for it.
      - path: reference/paths
        title: Paths and state
        summary: What multiversectl writes, where, and which files it generates.
  - title: Troubleshooting
    pages:
      - path: reference/troubleshooting
        title: Troubleshooting
        nav: Common problems
        summary: >-
          Hostnames that do not resolve, ports in use, missing secrets and dev
          servers that answer 403.
