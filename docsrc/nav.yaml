# The site's menu and its page order, read by internal/tools/docgen.
# A page here needs a fragment of the same path; a fragment with no page here
# is an error, because nothing would link to it.
groups:
  - title: Start
    pages:
      - path: index
        title: multiversectl
        nav: Overview
        hero: true
        summary: >-
          Run your whole multi-repository stack as many times as you need,
          side by side, on one machine. Every copy gets its own branch, its
          own containers and its own hostnames.
      - path: start/install
        title: Install
        summary: One binary for Linux and macOS, from a script, mise, a .deb or source.
      - path: start/quickstart
        title: Quick start
        summary: >-
          Describe a workspace, create a universe and open it — from nothing to
          two running copies of a project.
      - path: start/concepts
        title: Concepts at a glance
        nav: Concepts at a glance
        summary: >-
          The five words this documentation uses — workspace, universe, app,
          host and entrypoint — and how they fit together.
  - title: Concepts
    pages:
      - path: concepts/universes
        title: Universes
        summary: >-
          What a universe is made of, how it is named, and what it does and
          does not share with the others.
      - path: concepts/networking
        title: Networking
        summary: >-
          One shared proxy, one hostname per address per universe, and why no
          universe publishes a port of its own.
      - path: concepts/storage
        title: Storage and data
        summary: >-
          Where a universe's code, images, volumes and secrets live, which of
          them are shared, and what removing one destroys.
      - path: concepts/overlays
        title: Overlays and merge order
        summary: >-
          The files that make up an app, the order they are merged in, and
          where to put a value that only this environment knows.
      - path: concepts/labels
        title: Labels
        summary: >-
          How a compose file describes itself: the addresses it answers on, the
          ports it must keep, and the values it needs from its universe.
      - path: concepts/catalogs
        title: Catalogs
        summary: >-
          An index of workspaces and of other indexes, kept in git, that says
          what exists and leaves what is installed to each machine.
  - title: Tasks
    pages:
      - path: tasks/branches
        title: Work across branches
        summary: >-
          Put a feature in its own universe, override one repository's branch,
          add a repository, and remove a universe when you are done.
      - path: tasks/reach
        title: Reach a universe
        summary: >-
          From another device, from a domain you own, from a shell, and from a
          database client.
      - path: tasks/services
        title: Control which services run
        summary: >-
          Start optional services on demand, keep a published port, and give a
          service its own hostname.
      - path: tasks/catalog
        title: Manage many projects from one index
        summary: >-
          Set up a root catalog, nest another one under it, list workspaces in
          it, and install only the ones this machine needs.
  - title: Reference
    pages:
      - path: reference/cli
        title: Commands
        summary: Every command, what it does and the arguments it takes.
      - path: reference/manifest
        title: Manifest
        summary: Every field of a workspace manifest, with its default.
      - path: reference/variables
        title: Variables and labels
        summary: >-
          What a universe passes to the runtime, and the labels a compose file
          can use to ask for it.
      - path: reference/paths
        title: Paths and state
        summary: What multiversectl writes, where, and which files it generates.
  - title: Troubleshooting
    pages:
      - path: reference/troubleshooting
        title: Troubleshooting
        nav: Common problems
        summary: >-
          Hostnames that do not resolve, ports in use, missing secrets and dev
          servers that answer 403.
