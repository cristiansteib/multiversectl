# Generated by `make schema` from internal/adapters/manifest/v1alpha1.
# Edit the Go types and their doc comments, not this file.
#
# Written as a CustomResourceDefinition because that shape is a familiar way
# to read what the fields are and what they mean. Nothing applies it to a
# cluster: it documents the format and can feed a validator or an editor.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.multiverse
spec:
  group: multiverse
  scope: Namespaced
  names:
    kind: Workspace
    plural: workspaces
    singular: workspace
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Workspace is one project that can exist several times on a
            machine. Each copy is a universe: a git worktree of every
            repository here, one container runtime project per app, and
            hostnames of the form <host>-<universe>.<domain> served through
            one shared reverse proxy. A universe is numbered, and then its
            part of a hostname is u3, or named after a branch, and then it
            is fix-login.
          required: [apiVersion, kind, metadata, spec]
          properties:
            apiVersion:
              type: string
              description: >-
                The only version this build understands.
              enum: ["multiverse/v1alpha1"]
            kind:
              type: string
              enum: ["Workspace"]
            metadata:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: >-
                    Names the workspace and prefixes every runtime project,
                    so a universe's containers are
                    <name>-<universe>-<app>-*, e.g. acme-u3-api-web-1.
                  pattern: "^[a-z][a-z0-9-]*$"
            spec:
              type: object
              required: [repos]
              properties:
                root:
                  type: string
                  description: >-
                    Where this project's clones and universes live. Lets the
                    manifest be used from anywhere with -f, which is the
                    point of keeping one manifest per project in one
                    directory. A leading ~/ is expanded. Overridden by
                    --root and by $MULTIVERSECTL_ROOT; falls back to the
                    saved config, then to the manifest's own directory.
                expose:
                  type: string
                  description: >-
                    Who can reach a universe. "lan" publishes the proxy on
                    every interface and, with domain "auto", builds
                    hostnames under a public wildcard DNS name resolving to
                    this machine, so a phone or a reviewer on the same
                    network can open one. "local" publishes on the loopback
                    address only and, with domain "auto", uses
                    <host>.localhost, which every browser resolves to
                    127.0.0.1 without asking anyone: nothing about the
                    project leaves the machine, and nothing outside it can
                    connect. Choose "local" unless another device has to
                    open a universe.
                  default: lan
                  enum: ["lan", "local"]
                domain:
                  type: string
                  description: >-
                    Wildcard domain every hostname is built under. "auto"
                    derives it from expose: <dashed-lan-ip>.traefik.me for
                    "lan", localhost for "local". Set it to a domain you own
                    when you want your own certificates; expose still
                    decides which interface answers.
                  default: auto
                branch:
                  type: string
                  description: >-
                    Branch each universe's worktrees are checked out on.
                    {{universe}} expands to the number, so "u{{universe}}"
                    gives universe 3 the branch u3. Set it to follow your
                    own convention — "dev/u{{universe}}", or a fixed name
                    every universe shares. `new --branch` overrides it.
                  default: u{{universe}}
                proxy:
                  type: object
                  properties:
                    kind:
                      type: string
                      default: traefik
                      enum: ["traefik"]
                    network:
                      type: string
                      description: >-
                        External container network the proxy and every
                        routed service join. Created if missing.
                      default: multiversenet
                    entrypoints:
                      type: array
                      description: >-
                        Ports the proxy listens on, named. Host rules pick
                        one by name; "web" is the default. A second
                        entrypoint is how a browser application that expects
                        its API on a fixed port keeps working: the proxy
                        answers there too and routes by Host header, so
                        every universe shares the one port.
                      items:
                        type: object
                        required: [name, port]
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z][a-z0-9-]*$"
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                  description: >-
                    The shared ingress every universe is reached through.
                repos:
                  type: array
                  description: >-
                    The repositories this project is made of. install clones
                    them; each universe gets a worktree of every one,
                    sharing the clone's object store.
                  minItems: 1
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name:
                        type: string
                        description: >-
                          Key used by apps, by the universe's subdirectory
                          and by the <NAME>_DIR variable passed to the
                          runtime.
                        pattern: "^[a-z][a-z0-9-]*$"
                      url:
                        type: string
                        description: >-
                          Clone URL.
                      dir:
                        type: string
                        description: >-
                          Clone directory name under the root. Defaults to
                          the repository's name; set it when the directory
                          on disk does not match the key you want.
                      runtime:
                        type: string
                        description: >-
                          "none" for a repository with no services — it is
                          still checked out into every universe for editing,
                          but nothing starts.
                        default: compose
                        enum: ["compose", "none"]
                apps:
                  type: array
                  description: >-
                    The runnable units. A repository whose runtime is
                    "compose" and that no entry here names gets an app of
                    its own name, so most repositories need nothing: the
                    compose files are found by convention, every service
                    they define is started, and the addresses come from
                    their labels. Name a repository here to change any of
                    that, or to split it into several apps.
                  items:
                    type: object
                    required: [name, repo]
                    properties:
                      name:
                        type: string
                        description: >-
                          Also the runtime project suffix, so each app's
                          containers are namespaced separately and two
                          repositories may both call a service "app".
                        pattern: "^[a-z][a-z0-9-]*$"
                      repo:
                        type: string
                        description: >-
                          Which repo, by name, holds this app.
                      build:
                        type: boolean
                        description: >-
                          Build images before starting. Inferred when a
                          service has a build section, so it is rarely
                          needed.
                      compose:
                        type: array
                        description: >-
                          Runtime files, in merge order. A plain path is
                          relative to the repository checkout; a path
                          starting with @ is relative to the manifest's
                          directory. When omitted, two conventional places
                          are tried, whichever exist: docker-compose.yml in
                          the repository, and overlays/<app>.yml or
                          <manifest-name>/<app>.yml next to the manifest.
                        items:
                          type: string
                      profiles:
                        type: array
                        description: >-
                          Compose profiles always active for this app.
                        items:
                          type: string
                      services:
                        type: array
                        description: >-
                          Services to start. Omit it to start every service
                          the compose files define for the active profiles,
                          which is what `docker compose up` would do. Name
                          them only when a file also holds services a
                          universe should not run.
                        items:
                          type: string
                      optional:
                        type: array
                        description: >-
                          Named groups of extra services, started on demand
                          with --with <name>. The name is also activated as
                          a compose profile.
                        items:
                          type: object
                          required: [name, services]
                          properties:
                            name:
                              type: string
                            services:
                              type: array
                              items:
                                type: string
                      secrets:
                        type: array
                        description: >-
                          Files that are deliberately not in git —
                          credentials, service accounts — copied from the
                          clone into each universe's checkout. doctor fails
                          when one is missing, rather than letting the
                          universe half-start.
                        items:
                          type: string
                      publish:
                        type: array
                        description: >-
                          Services allowed to keep their published host
                          ports. Every other service's ports are dropped,
                          because a universe is reached through the proxy
                          and published ports are what make two copies
                          collide. A service can ask for this itself with
                          the label multiverse.publish: "true".
                        items:
                          type: string
                      overlay:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: >-
                          A compose fragment written inline, merged last
                          before the generated routing file. Use it for the
                          few things only this environment knows — a
                          trusted-origins variable, a dev server flag — or
                          as the whole service definition for a repository
                          that has no compose file. It is compose syntax,
                          kept verbatim, and may reference the variables
                          listed at the bottom of this file.
                      hosts:
                        type: array
                        description: >-
                          Addresses this app answers on, for a repository
                          you cannot change. Usually leave it out: a service
                          that carries multiverse.host.<name> labels
                          declares its own addresses, and a service exposing
                          exactly one port is reached at the app's own name
                          with no configuration at all. Declaring hosts here
                          wins over both.
                        items:
                          type: object
                          required: [name, port, service]
                          properties:
                            name:
                              type: string
                              description: >-
                                Host key. The hostname becomes
                                <name>-<universe>.<domain>, and the
                                variables <NAME>_HOST and <NAME>_URL are
                                passed to the runtime.
                              pattern: "^[a-z][a-z0-9-]*$"
                            service:
                              type: string
                              description: >-
                                Compose service that serves it.
                            port:
                              type: integer
                              description: >-
                                Port inside the container.
                            entrypoint:
                              type: string
                              description: >-
                                Proxy entrypoint, by name.
                              default: web
                            alsoMatch:
                              type: array
                              description: >-
                                Other host keys routed to this same service.
                                Used when one service must answer on a
                                second entrypoint under the front-ends'
                                hostnames.
                              items:
                                type: string
                env:
                  type: array
                  description: >-
                    Variables exported into every runtime invocation.
                    {{uid}} and {{gid}} expand to the current user, ${VAR}
                    to the environment. HOST_UID and HOST_GID are always
                    provided; an entry here overrides them.
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name:
                        type: string
                      value:
                        type: string

# ─────────────────────────────────────────────────────────────────────────────
# How a service says it is reached. The label key names the host, the value is
# the port:
#
#   services:
#     app-dev:
#       labels:
#         multiverse.host.app: "4200"              # app-u3.<domain> -> 4200
#         multiverse.host.api: "8001"
#         multiverse.host.api.entrypoint: devapi   # default: web
#         multiverse.host.api.aliases: app,adm     # same service, other names
#         multiverse.publish: "true"               # keep my published ports
#         multiverse.env.DJANGO_ALLOWED_HOSTS: hosts
#         multiverse.env.DJANGO_CSRF_TRUSTED_ORIGINS: origins
#
# multiverse.env.<VAR> asks for a value only the universe knows, written into
# the generated fragment, which is merged last — so it wins over the service's
# own environment and over any env_file. The sources are:
#
#   origins        every address as an origin, each with its entrypoint's port
#   hosts          every hostname
#   domain         the wildcard domain in use
#   universe       the universe's name
#   slug           the part its hostnames carry
#   host:<key>     one host key's hostname
#   url:<key>      one host key's whole address
#
# A label rather than ${MULTIVERSE_ORIGINS} in the service's environment,
# because a compose file is also run by hand: a reference resolves to the empty
# string when multiversectl is not driving, while a label is inert until it is.
#
# With no labels at all, a service exposing exactly one port is reached at the
# app's own name, so the common case needs nothing. Anything ambiguous — several
# services with ports, or one service with several — is an error naming the
# label to add, rather than a guess.
#
# Variables available to compose files and to an inline overlay:
#
#   UNIVERSE, UNIVERSE_SLUG, UNIVERSE_DIR   its name, the part hostnames carry, its path
#   MULTIVERSE_DOMAIN                       the wildcard domain in use
#   COMPOSE_PROJECT_NAME                    the app's runtime project
#   <HOST>_HOST                             one per host key, e.g. APP_HOST
#   <HOST>_URL                              the same with scheme and port
#   MULTIVERSE_HOSTS                        every hostname, comma separated
#   MULTIVERSE_ORIGINS                      every one as an origin, with ports
#   <REPO>_DIR                              one per repository checkout
#   HOST_UID, HOST_GID                      the current user
#
# The last two are what a framework's trusted-origin, allowed-host or CORS
# setting wants: name them in an overlay and the list follows the manifest
# instead of being kept in step by hand.
#
#   overlay:
#     services:
#       web:
#         environment:
#           DJANGO_CSRF_TRUSTED_ORIGINS: "${MULTIVERSE_ORIGINS}"
#           DJANGO_ALLOWED_HOSTS: "${MULTIVERSE_HOSTS}"
# ─────────────────────────────────────────────────────────────────────────────
