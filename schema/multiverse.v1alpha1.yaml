# Generated by `make schema` from internal/adapters/manifest/v1alpha1.
# Edit the Go types and their doc comments, not this file.
#
# Written as a CustomResourceDefinition because that shape is a familiar way
# to read what the fields are and what they mean. Nothing applies it to a
# cluster: it documents the format and can feed a validator or an editor.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: multiverses.multiverse
spec:
  group: multiverse
  scope: Namespaced
  names:
    kind: Multiverse
    plural: multiverses
    singular: multiverse
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Multiverse is the definition of a set of repositories that run
            together, and that can exist several times on a machine. Each
            copy is a universe: a git worktree of every repository here, one
            compose project per app, and hostnames of the form
            <host>-<universe>.<domain> served through one shared reverse
            proxy. A universe is numbered, and then its part of a hostname
            is u3, or named after a branch, and then it is fix-login.
          required: [apiVersion, kind, metadata, spec]
          properties:
            apiVersion:
              type: string
              description: >-
                The only version this build understands.
              enum: ["multiverse/v1alpha1"]
            kind:
              type: string
              enum: ["Multiverse"]
            metadata:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: >-
                    Names the multiverse and prefixes every compose project,
                    so a universe's containers are
                    <name>-<universe>-<app>-*, e.g. acme-u3-api-web-1.
                  pattern: "^[a-z][a-z0-9-]*$"
            spec:
              type: object
              properties:
                root:
                  type: string
                  description: >-
                    Where this multiverse's clones and universes live. Lets
                    the manifest be used from anywhere with -f, which is the
                    point of keeping one manifest per multiverse in one
                    directory. A leading ~/ is expanded. Overridden by
                    --root and by $MULTIVERSECTL_ROOT; falls back to the
                    saved config, then to the manifest's own directory.
                expose:
                  type: string
                  description: >-
                    Who can reach a universe. "lan" publishes the proxy on
                    every interface and, with domain "auto", builds
                    hostnames under a public wildcard DNS name resolving to
                    this machine, so a phone or a reviewer on the same
                    network can open one. "local" publishes on the loopback
                    address only and, with domain "auto", uses
                    <host>.localhost, which every browser resolves to
                    127.0.0.1 without asking anyone: nothing about the
                    multiverse leaves the machine, and nothing outside it
                    can connect. Choose "local" unless another device has to
                    open a universe.
                  default: lan
                  enum: ["lan", "local"]
                domain:
                  type: string
                  description: >-
                    Wildcard domain every hostname is built under. "auto"
                    derives it from expose: <dashed-lan-ip>.traefik.me for
                    "lan", localhost for "local". Set it to a domain you own
                    when you want your own certificates (proxy.certificates,
                    and tls on an entrypoint); expose still decides which
                    interface answers. "none" opts out of hostnames
                    altogether: nothing is resolved, and every host is
                    reached at this machine's address on a port of its own
                    (portForward is implied), so a universe is just
                    <ip>:<port>.
                  default: auto
                branch:
                  type: string
                  description: >-
                    Branch each universe's worktrees are checked out on.
                    {{universe}} expands to the number, so "u{{universe}}"
                    gives universe 3 the branch u3. Set it to follow your
                    own convention — "dev/u{{universe}}", or a fixed name
                    every universe shares. `new --branch` overrides it.
                  default: u{{universe}}
                proxy:
                  type: object
                  properties:
                    kind:
                      type: string
                      default: traefik
                      enum: ["traefik"]
                    network:
                      type: string
                      description: >-
                        External container network the proxy and every
                        routed service join. Created if missing.
                      default: multiversenet
                    entrypoints:
                      type: array
                      description: >-
                        Ports the proxy listens on, named. Host rules pick
                        one by name; "web" is the default. A second
                        entrypoint is how a browser application that expects
                        its API on a fixed port keeps working: the proxy
                        answers there too and routes by Host header, so
                        every universe shares the one port.
                      items:
                        type: object
                        required: [name, port]
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z][a-z0-9-]*$"
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          tls:
                            type: boolean
                            description: >-
                              Serve every host on this entrypoint over
                              https. Each address handed to a service or
                              shown (<NAME>_URL, origins) then says
                              https://, so a framework that checks the
                              Origin header sees the one the browser sends.
                    certificates:
                      type: array
                      description: >-
                        Certificates the TLS entrypoints present, for a
                        domain of your own: a wildcard one for *.<domain>
                        covers every universe. A relative path is relative
                        to the manifest's directory, and a leading ~/ is
                        expanded. Without any, the proxy presents its own
                        self-signed certificate.
                      items:
                        type: object
                        required: [certFile, keyFile]
                        properties:
                          certFile:
                            type: string
                            description: >-
                              The certificate, in PEM, with its chain.
                          keyFile:
                            type: string
                            description: >-
                              Its private key, in PEM.
                  description: >-
                    The shared ingress every universe is reached through.
                repos:
                  type: array
                  description: >-
                    The repositories this multiverse is made of. install
                    clones them; each universe gets a worktree of every one,
                    sharing the clone's object store. Required in a
                    multiverse; a repository's own file (.multiverse.yaml)
                    describes only itself and leaves it out.
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name:
                        type: string
                        description: >-
                          Key used by apps, by the universe's subdirectory
                          and by the <NAME>_DIR variable passed to the
                          runtime.
                        pattern: "^[a-z][a-z0-9-]*$"
                      url:
                        type: string
                        description: >-
                          Clone URL.
                      dir:
                        type: string
                        description: >-
                          Clone directory name under the root. Defaults to
                          the repository's own name, as git would clone it
                          (acme-api for .../acme-api.git), so it is rarely
                          needed; set it when the directory on disk is
                          called otherwise. A repository with no compose
                          file is still checked out into every universe for
                          editing, and nothing starts for it.
                      base:
                        type: string
                        description: >-
                          The branch a new universe's branch starts from,
                          and what it is measured against while there is no
                          pull request saying otherwise. Leave it out for
                          the remote's default branch; set it when work
                          starts elsewhere, such as develop. `universe new
                          --base` overrides it.
                apps:
                  type: array
                  description: >-
                    The runnable units. A repository whose runtime is
                    "compose" and that no entry here names gets an app of
                    its own name, so most repositories need nothing: the
                    compose files are found by convention, every service
                    they define is started, and the addresses come from
                    their labels. Name a repository here to change any of
                    that, or to split it into several apps.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: >-
                          Also the compose project suffix, so each app's
                          containers are namespaced separately and two
                          repositories may both call a service "app".
                        pattern: "^[a-z][a-z0-9-]*$"
                      repo:
                        type: string
                        description: >-
                          Which repo, by name, holds this app. Leave it out
                          in a repository's own file: the app is that
                          repository's.
                      autostart:
                        type: boolean
                        description: >-
                          Whether `universe up` and `universe start` bring
                          this app up when no app is named. Set it to false
                          for an app that should be checked out and have its
                          addresses but run only when asked for (`universe
                          up 3 <app>`): a tool that needs setup, a code
                          generator, a heavy optional service. Commands that
                          look after what runs (down, rm, status, doctor,
                          ls) still deal with it when it is up, and do not
                          report it as a problem when it is not.
                        default: true
                      build:
                        type: boolean
                        description: >-
                          Build images before starting. Inferred when a
                          service has a build section, so it is rarely
                          needed.
                      compose:
                        type: array
                        description: >-
                          Runtime files, in merge order. A plain path is
                          relative to the repository checkout; a path
                          starting with @ is relative to the manifest's
                          directory. When omitted, two conventional places
                          are tried, whichever exist: docker-compose.yml in
                          the repository, and overlays/<app>.yml or
                          <manifest-name>/<app>.yml next to the manifest.
                        items:
                          type: string
                      profiles:
                        type: array
                        description: >-
                          Compose profiles always active for this app.
                        items:
                          type: string
                      services:
                        type: array
                        description: >-
                          Services to start. Omit it to start every service
                          the compose files define for the active profiles,
                          which is what `docker compose up` would do. Name
                          them only when a file also holds services a
                          universe should not run.
                        items:
                          type: string
                      optional:
                        type: array
                        description: >-
                          Named groups of extra services, started on demand
                          with --with <name>. The name is also activated as
                          a compose profile.
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                              description: >-
                                The group's name, and the compose profile it
                                activates.
                            services:
                              type: array
                              description: >-
                                The services the group adds. Leave it out
                                when the profile already says which they
                                are; it is needed when the app names its
                                services, as compose then starts only the
                                ones named.
                              items:
                                type: string
                      secrets:
                        type: array
                        description: >-
                          Files that are deliberately not in git —
                          credentials, service accounts — copied from the
                          clone into each universe's checkout. doctor fails
                          when one is missing, rather than letting the
                          universe half-start.
                        items:
                          type: string
                      secretTemplates:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: >-
                          Where a secret is in neither the clone nor the
                          universe, it is made from the file named here, in
                          the repository, and kept in the clone so every
                          universe copies the same one. By default that is
                          the secret's own name with .example added (.env
                          from .env.example); name another file to use it
                          instead, or "" to never make one, so a missing
                          secret stops the start and says where to put it.
                      hooks:
                        type: object
                        description: >-
                          Hooks tie commands to the points of a universe's
                          life. Each event lists hooks, run in order; every
                          command gets the universe's name, directory and
                          addresses as environment variables (the ones a
                          compose file can use, plus MULTIVERSE_EVENT,
                          MULTIVERSE_APP and, on the machine,
                          MULTIVERSE_CONTEXT_FILE: a JSON file with the same
                          and more). Under spec, they run on the machine
                          only.
                        properties:
                          postCreate:
                            type: array
                            description: >-
                              Once the universe's worktrees exist, before
                              anything starts. On the machine.
                            items:
                              type: object
                              description: >-
                                Hook is one command: give it container, to
                                run it in a service, or host, to run it on
                                this machine.
                              properties:
                                name:
                                  type: string
                                  description: >-
                                    Name says which hook it is in the
                                    output.
                                container:
                                  type: object
                                  description: >-
                                    ContainerHook is a command run in a
                                    running service.
                                  required: [command]
                                  properties:
                                    service:
                                      type: string
                                      description: >-
                                        Compose service to run it in. Leave
                                        it out when the app has one service,
                                        or names a defaultService.
                                    command:
                                      type: array
                                      description: >-
                                        The command and its arguments, as
                                        compose writes a command, with no
                                        shell: ["python", "manage.py",
                                        "loaddata"].
                                      items:
                                        type: string
                                  description: >-
                                    Run in a running service, with no
                                    terminal. For postUp and preDown.
                                host:
                                  type: object
                                  description: >-
                                    HostHook is a command run on the machine
                                    that runs multiversectl.
                                  required: [command]
                                  properties:
                                    command:
                                      type: array
                                      description: >-
                                        The command and its arguments, with
                                        no shell: ["sh", "-c", "curl ... |
                                        jq"] when one is wanted.
                                      items:
                                        type: string
                                    dir:
                                      type: string
                                      description: >-
                                        Where it runs, relative to the
                                        universe's directory: "api" is that
                                        repository's checkout. By default
                                        the universe's directory.
                                  description: >-
                                    Run on this machine, in any event. No
                                    shell: to use one, say it.
                                once:
                                  type: boolean
                                  description: >-
                                    Run on the first start of each universe
                                    only, and never again: for what loads
                                    data a person may then change, such as
                                    the user to log in with. Without it the
                                    hook runs after every start, so it
                                    should be safe to repeat.
                                skipIf:
                                  type: array
                                  description: >-
                                    A command run first, in the same place
                                    as this one (the same service, or the
                                    same directory on the machine), to ask
                                    whether the work is already done: exit
                                    status 0 means it is, and the hook is
                                    skipped. Unlike once, which remembers
                                    that the hook ran, this looks at what it
                                    produced, so data that was lost (a
                                    database volume that was recreated) is
                                    loaded again. When it is set it decides,
                                    and once is not used. Not used when the
                                    hook is run by hand with `universe hooks
                                    run`.
                                  items:
                                    type: string
                                onFailure:
                                  type: string
                                  description: >-
                                    What it means when the command does not
                                    succeed: warn says so and goes on (the
                                    default, so a hook that breaks cannot
                                    keep a universe from being stopped or
                                    removed), fail ends the command, ignore
                                    goes on silently. A preUp hook fails by
                                    default, since what it prepares is what
                                    the start needs.
                                  enum: ["warn", "fail", "ignore"]
                                retryFor:
                                  type: string
                                  description: >-
                                    Keep trying for this long, as a duration
                                    such as 30s or 3m, because what the
                                    command needs may still be starting. A
                                    command in a container after the app is
                                    up defaults to 3m; any other to a single
                                    try.
                                timeout:
                                  type: string
                                  description: >-
                                    End one try that takes longer, as a
                                    duration. By default none does.
                          preUp:
