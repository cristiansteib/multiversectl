                        type: array
                        description: >-
                          Addresses this app answers on, for a repository
                          you cannot change. Usually leave it out: a service
                          that carries dev.multiversectl.host.<name> labels
                          declares its own addresses, and a service exposing
                          exactly one port is reached at the app's own name
                          with no configuration at all. Declaring hosts here
                          wins over both.
                        items:
                          type: object
                          required: [name, port, service]
                          properties:
                            name:
                              type: string
                              description: >-
                                Host key. The hostname becomes
                                <name>-<universe>.<domain>, and the
                                variables <NAME>_HOST and <NAME>_URL are
                                passed to the runtime.
                              pattern: "^[a-z][a-z0-9-]*$"
                            service:
                              type: string
                              description: >-
                                Compose service that serves it.
                            port:
                              type: integer
                              description: >-
                                Port inside the container.
                            entrypoint:
                              type: string
                              description: >-
                                Proxy entrypoint, by name.
                              default: web
                            alsoMatch:
                              type: array
                              description: >-
                                Other host keys routed to this same service.
                                Used when one service must answer on a
                                second entrypoint under the front-ends'
                                hostnames.
                              items:
                                type: string
                            portForward:
                              type: string
                              description: >-
                                "auto" also publishes the host on a free
                                host port, so a client that refuses plain
                                http to a hostname (an iPhone app) can call
                                http://<this machine's address>:<port>. The
                                port is chosen once and kept; `universe ls`
                                shows the address as <host>:forward. A host
                                that comes from a compose label asks for the
                                same with
                                dev.multiversectl.host.<name>.portForward.
                                "only" is the same without the hostname: the
                                host is reached by that IP and port alone,
                                and no address shown or handed to a service
                                is a name, for a service that should not be
                                known by one. `domain: none` does this for
                                every host.
                              enum: ["auto", "only"]
                            scheme:
                              type: string
                              description: >-
                                How the proxy talks to the service. Leave it
                                out for plain http; "h2c" is for a service
                                that speaks HTTP/2 without TLS, such as a
                                gRPC one, which otherwise answers the
                                proxy's HTTP/1.1 with an error; "https" is
                                for a service that only serves TLS, and its
                                certificate is not verified, since a
                                development one is usually self-signed. A
                                host that comes from a compose label asks
                                for the same with
                                dev.multiversectl.host.<name>.scheme.
                              enum: ["http", "https", "h2c"]
                            ready:
                              type: string
                              description: >-
                                Makes `up` wait until this host answers
                                before it goes on to the app's postUp hooks:
                                "true" asks the address over HTTP until it
                                answers with a status below 500 (a TCP
                                connection for an h2c host or a probe of
                                tcp), "tcp" only connects, a path such as
                                "/healthz" asks that path, and "false" (the
                                default) does not wait. It is polled until
                                --wait-timeout. A host that comes from a
                                compose label asks for the same with
                                dev.multiversectl.host.<name>.ready.
                            probe:
                              type: string
                              description: >-
                                How `doctor` checks this host. By default it
                                asks the address over HTTP (a TCP connection
                                for an h2c host); "tcp" connects, "grpc"
                                connects (the standard gRPC health check is
                                not run, as multiversectl carries no gRPC
                                client), "http" forces the HTTP request, and
                                "none" leaves the host out. A host that
                                comes from a compose label asks for the same
                                with dev.multiversectl.host.<name>.probe.
